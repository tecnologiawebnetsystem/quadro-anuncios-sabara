<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f4e79">
    <title>Sem conexão — Quadro de Anúncios</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f5f8fb; color: #18324b; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #d5e1ec; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 12px 32px rgb(24 50 75 / 10%); }
      h1 { margin: 0 0 12px; color: #123b68; font-size: 1.6rem; }
      p { margin: 0; color: #4d667c; line-height: 1.6; }
      button { margin-top: 24px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #1f4e79; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #e9a72f; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>O Quadro de Anúncios precisa de internet para carregar os dados atualizados. Verifique sua conexão e tente novamente.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
